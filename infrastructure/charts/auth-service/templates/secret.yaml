{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth-service.fullname" . }}-secret
  labels:
    {{- include "auth-service.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USER: {{ .Values.secret.dbUser | b64enc | quote }}
  DB_PASS: {{ .Values.secret.dbPass | b64enc | quote }}
  JWT_SECRET: {{ .Values.secret.jwtSecret | b64enc | quote }}
  REDIS_PASS: {{ .Values.secret.redisPass | b64enc | quote }}
{{- end }}