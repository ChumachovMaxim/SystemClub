events {}
http {
    lua_package_path "/usr/local/openresty/lualib/?.lua;;";
    lua_package_cpath "/usr/local/openresty/lualib/?.so;;";

    # Rate limiting: 5 запросов в секунду
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5r/s;

    # Кэш для JWKS
    lua_shared_dict cache 10m;

    # Логирование
    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 80;
        server_name example.local;

        location / {
            # Rate limiting
            limit_req zone=mylimit burst=20 nodelay;

            # Валидация JWT
            access_by_lua_block {
                local http = require "resty.http"
                local jwt = require "resty.jwt"
                local cjson = require "cjson"

                -- Кэширование JWKS
                local cache = ngx.shared.cache
                local jwks = cache:get("jwks")
                local ttl = 3600 -- 1 час

                if not jwks then
                    local httpc = http.new()
                    local res, err = httpc:request_uri("http://host.docker.internal:8080/.well-known/jwks.json", {
                        method = "GET",
                        headers = { ["Accept"] = "application/json" }
                    })

                    if not res then
                        ngx.log(ngx.ERR, "Failed to fetch JWKS: ", err)
                        ngx.status = 502
                        ngx.say("Failed to fetch JWKS")
                        ngx.exit(502)
                    end

                    jwks = cjson.decode(res.body)
                    if not jwks or not jwks.keys then
                        ngx.status = 502
                        ngx.say("Invalid JWKS format")
                        ngx.exit(502)
                    end

                    cache:set("jwks", res.body, ttl)
                else
                    jwks = cjson.decode(jwks)
                end

                -- Получение токена
                local auth_header = ngx.var.http_authorization
                local token = nil
                if auth_header then
                    _, _, token = string.find(auth_header, "Bearer%s+(.+)")
                end

                if not token then
                    ngx.status = 401
                    ngx.say("Missing token")
                    ngx.exit(401)
                end

                -- Валидация токена
                local jwt_obj = jwt:verify(jwks, token, { alg = "RS256" })
                if not jwt_obj.valid then
                    ngx.status = 401
                    ngx.say("Invalid token: " .. jwt_obj.reason)
                    ngx.exit(401)
                end

                -- Логирование payload
                ngx.log(ngx.INFO, "JWT Payload: ", cjson.encode(jwt_obj.payload))
            }

            # Проксирование к приложению
            proxy_pass http://app:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}